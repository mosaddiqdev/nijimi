<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Nijimi</title>
  <defs>
    <clipPath id="tile">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
    <!-- reflection: ink that bleeds away into the wet paper -->
    <linearGradient id="bleed" x1="0" y1="38" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b2b2d" stop-opacity=".7"/>
      <stop offset="1" stop-color="#2b2b2d" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="bleedFar" x1="0" y1="38" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6c7782" stop-opacity=".45"/>
      <stop offset="1" stop-color="#6c7782" stop-opacity=".05"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#tile)">
    <!-- paper -->
    <rect width="64" height="64" fill="#ece6d8"/>

    <!-- sun -->
    <circle cx="14" cy="12" r="6" fill="#b9a98a"/>

    <!-- far range and its reflection -->
    <path d="M0 38 V29 L24 15 Q28 13 32 16 L44 26 L54 18 Q58 15.500 62 18 L64 19.500 V38 Z" fill="#6c7782" fill-opacity=".55"/>
    <path d="M0 38 V47 L24 61 Q28 63 32 60 L44 50 L54 58 Q58 60.500 62 58 L64 56.500 V38 Z" fill="url(#bleedFar)"/>

    <!-- near range and its reflection -->
    <path d="M0 38 V35 L14 23 Q18 19.500 22 23 L32 32 L42 20 Q46 16.500 50 20 L64 32 V38 Z" fill="#2b2b2d"/>
    <path d="M0 38 V41 L14 53 Q18 56.500 22 53 L32 44 L42 56 Q46 59.500 50 56 L64 44 V38 Z" fill="url(#bleed)"/>

    <!-- water gaps: paper showing through the reflection -->
    <g stroke="#ece6d8" stroke-width="1.400" stroke-linecap="round">
      <path d="M8 46 H25"/>
      <path d="M33 52 H53"/>
    </g>
  </g>
</svg>
